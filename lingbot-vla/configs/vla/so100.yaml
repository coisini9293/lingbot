# SO-100 训练配置（适配 svla_so101_pickplace 数据集）
# 使用 real_load20000h 作为基础配置

model:
  model_path: ../models/pretrained/lingbot-vla-4b
  tokenizer_path: ../models/pretrained/Qwen2.5-VL-3B-Instruct

data:
  datasets_type: vla
  data_name: so100
  train_path: ../data/raw/svla_so101_pickplace
  joints:
    - arm.position: 5
    - effector.position: 1
  cameras:
    - camera_top
    - camera_wrist_left
  # 数据加载：CPU 并行解码 + pin_memory 喂满 GPU；worker 不占用 CUDA（见 data_loader.worker_init）
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2
  video_backend: torchcodec
  norm_type: meanstd
  norm_stats_file: assets/norm_stats/so100_svla.json

train:
  output_dir: "output/"
  data_parallel_mode: fsdp2
  enable_full_shard: false
  module_fsdp_enable: true
  use_compile: true
  rmpad: false
  rmpad_with_pos_ids: false
  ulysses_parallel_size: 1
  freeze_vision_encoder: false
  tokenizer_max_length: 72
  max_action_dim: 75
  max_state_dim: 75
  lr: 5.0e-5
  lr_decay_style: constant
  micro_batch_size: 2
  gradient_accumulation_steps: 16
  # 训练时长由 max_steps 控制（非 epoch）；本数据集约 373 step/epoch
  max_steps: 1024
  ckpt_manager: dcp
  # save_steps=0：仅在 max_steps 结束时保存 global_step_{N}/（每个 ~21GB）
  save_steps: 0
  save_epochs: 0
  max_checkpoints_to_keep: 1
  save_optimizer: false
  enable_fp32: true
  enable_resume: false
